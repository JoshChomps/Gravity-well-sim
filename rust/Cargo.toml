[package]
name = "gravity-sim"
version = "0.1.0"
edition = "2021"
description = "3D N-body gravity simulator with spacetime-curvature grids, native and WebAssembly"

[dependencies]
macroquad = { version = "0.4.16", default-features = false }

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }

[profile.dev.package."*"]
opt-level = 2
